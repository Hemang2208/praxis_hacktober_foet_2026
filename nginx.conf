server {
    listen 80;
    server_name localhost;

    # Gzip settings for performance optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Client settings - increased for file uploads and large payloads
    client_max_body_size 50M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Global timeout settings for long-running AI operations
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Keepalive settings
    keepalive_timeout 300s;

    # Global proxy headers (applied to all locations)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # HTTP version for better performance
    proxy_http_version 1.1;

    # ==========================================
    # API Documentation Routes (must come first)
    # ==========================================
    
    location /docs {
        proxy_pass http://api-gateway:8000/docs;
    }

    location /docs/ {
        proxy_pass http://api-gateway:8000/docs/;
    }

    location /redoc {
        proxy_pass http://api-gateway:8000/redoc;
    }

    location /redoc/ {
        proxy_pass http://api-gateway:8000/redoc/;
    }

    location /openapi.json {
        proxy_pass http://api-gateway:8000/openapi.json;
    }

    # Agent-specific documentation routes with proper OpenAPI handling
    location ~ ^/agent/([^/]+)/docs$ {
        proxy_pass http://api-gateway:8000/agent/$1/docs;
        sub_filter "url: '/openapi.json'" "url: '/agent/$1/openapi.json'";
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }

    location ~ ^/agent/([^/]+)/redoc$ {
        proxy_pass http://api-gateway:8000/agent/$1/redoc;
        sub_filter "'/openapi.json'" "'/agent/$1/openapi.json'";
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }

    # ==========================================
    # Agent Routes - Extended timeouts for AI
    # ==========================================
    
    location /agent/ {
        proxy_pass http://api-gateway:8000/agent/;
        
        # Extended timeouts for AI generation (5 minutes)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Disable buffering for streaming responses and immediate feedback
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Additional headers for tracking request timing
        proxy_set_header X-Request-Start $msec;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ==========================================
    # Backend API Gateway
    # ==========================================
    
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        
        # Standard API timeouts (2 minutes)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Enable buffering for regular API calls
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ==========================================
    # Frontend Service - Next.js (catch-all)
    # ==========================================
    
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for Next.js SSR (1 minute should be sufficient)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Enable buffering for static content
        proxy_buffering on;
    }
}
