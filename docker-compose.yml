services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kyo-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DOCKER_MODE=true
      - FASTAPI_BACKEND_URL=http://nginx
    networks:
      - kiyo-network

networks:
  kiyo-network:
    external: true
    name: kiyo-network